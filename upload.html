<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest | Upload Resource</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app-layout">


<aside class="sidebar">

    <div class="sidebar-logo">
        <div class="logo-box">N</div>

        <div>
            <h2>NoteNest</h2>
            <span>Student Hub</span>
        </div>
    </div>

    <nav class="sidebar-nav">

        <a href="index.html" class="nav-item">
            <span>⌂</span>
            <span>Home</span>
        </a>

        <a href="notes.html" class="nav-item">
            <span>▤</span>
            <span>My Notes</span>
        </a>

        <a href="resources.html" class="nav-item">
            <span>▥</span>
            <span>Resources</span>
        </a>

        <a href="upload.html" class="nav-item active">
            <span>＋</span>
            <span>Upload</span>
        </a>

        <a href="profile.html" class="nav-item">
            <span>○</span>
            <span>Profile</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <a href="login.html" class="logout-link">
            <span>↪</span>
            <span>Logout</span>
        </a>

    </div>

</aside>


<main class="main-content">

    <header class="topbar">

        <div>
            <h1>Upload a Resource</h1>

            <p>
                Share your notes and study materials with other students.
            </p>
        </div>

    </header>


    <section class="content-section">

        <div class="page-card upload-card">

            <div class="upload-intro">

                <div class="upload-icon">
                    ↑
                </div>

                <div>

                    <h2>Share Your Knowledge</h2>

                    <p>
                        Upload PDF, Word, PowerPoint, or Excel
                        study materials.
                    </p>

                </div>

            </div>


            <div
                id="uploadMessage"
                class="upload-message"
            ></div>


            <!-- IMPORTANT:
                 Keep upload.php because this is the
                 working backend used by the project.
            -->

            <form
                id="uploadForm"
                action="../backend/upload.php"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="form-grid">


                    <div class="form-group full-width">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            placeholder="Enter resource title"
                            required
                        >

                    </div>


                    <div class="form-group full-width">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="4"
                            placeholder="Describe your resource"
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="e.g. MATH165"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="e.g. BSIT"
                        >

                    </div>


                    <div class="form-group">

                        <label for="category_id">
                            Category
                        </label>

                        <select
                            id="category_id"
                            name="category_id"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="1">
                                Notes
                            </option>

                            <option value="2">
                                Reviewer
                            </option>

                            <option value="3">
                                Study Material
                            </option>

                            <option value="4">
                                Presentation
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="file">
                            File
                        </label>

                        <input
                            type="file"
                            id="file"
                            name="file"
                            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx"
                            required
                        >

                    </div>

                </div>


                <div class="upload-actions">

                    <a
                        href="resources.html"
                        class="secondary-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Upload Resource
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>


</div>

<script>

document
    .getElementById("uploadForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const form = this;
        const message = document.getElementById("uploadMessage");
        const button = form.querySelector("button[type='submit']");

        const formData = new FormData(form);

        message.textContent = "Uploading...";
        message.className = "upload-message";

        button.disabled = true;
        button.textContent = "Uploading...";

        try {

            const response = await fetch(
                "../backend/upload.php",
                {
                    method: "POST",
                    body: formData
                }
            );

            const text = await response.text();

            console.log("UPLOAD RESPONSE:", text);

            let data;

            try {

                data = JSON.parse(text);

            } catch (jsonError) {

                console.error(
                    "INVALID JSON RESPONSE:",
                    text
                );

                message.textContent =
                    "Server error. Please check the backend.";

                message.className =
                    "upload-message error";

                button.disabled = false;
                button.textContent = "Upload Resource";

                return;
            }

            if (data.success) {

                message.textContent =
                    data.message ||
                    "Resource uploaded successfully!";

                message.className =
                    "upload-message success";

                form.reset();

                setTimeout(function () {

                    window.location.href =
                        "resources.html";

                }, 1200);

            } else {

                message.textContent =
                    data.message ||
                    "Unable to upload resource.";

                message.className =
                    "upload-message error";

                button.disabled = false;
                button.textContent = "Upload Resource";
            }

        } catch (error) {

            console.error(
                "UPLOAD ERROR:",
                error
            );

            message.textContent =
                "Unable to connect to NoteNest. Make sure Apache is running.";

            message.className =
                "upload-message error";

            button.disabled = false;
            button.textContent = "Upload Resource";
        }

    });

</script>

</body>
</html>
