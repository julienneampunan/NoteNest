</div>

<script>

async function loadMyUploads() {

    const container =
        document.getElementById(
            "myUploadsContainer"
        );


    try {

        const response =
            await fetch(
                "../backend/get_my_uploads.php",
                {
                    method: "GET",
                    credentials: "include"
                }
            );


        const text =
            await response.text();


        console.log(
            "MY UPLOADS RESPONSE:",
            text
        );


        const data =
            JSON.parse(text);


        if (!data.success) {

            container.innerHTML = `
                <div class="empty-state">

                    <h2>
                        My Uploads
                    </h2>

                    <p>
                        ${data.message || "Please log in first."}
                    </p>

                </div>
            `;

            return;
        }


        if (
            !data.resources ||
            data.resources.length === 0
        ) {

            container.innerHTML = `
                <div class="empty-state">

                    <h2>
                        No Uploads Yet
                    </h2>

                    <p>
                        You have not uploaded any resources yet.
                    </p>

                    <br>

                    <a
                        href="upload.html"
                        class="btn-primary"
                    >
                        Upload a Resource
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML = "";

        data.resources.forEach(
            function(resource) {

                const card =
                    document.createElement("div");

                card.className =
                    "resource-card";

                card.style.marginBottom =
                    "15px";


                let filePath =
                    resource.file_path || "";


                if (
                    filePath.startsWith("/")
                ) {

                    filePath =
                        ".." + filePath;

                }
                else if (
                    !filePath.startsWith("uploads/")
                ) {

                    filePath =
                        "../" + filePath;

                }


                card.innerHTML = `

                    <div class="resource-icon">
                        📄
                    </div>

                    <h3>
                        ${escapeHTML(resource.title)}
                    </h3>

                    <div class="resource-description">

                        ${escapeHTML(
                            resource.description ||
                            "No description."
                        )}

                    </div>

                    <div class="resource-meta">

                        <span>
                            ${escapeHTML(
                                resource.subject ||
                                "No Subject"
                            )}
                        </span>

                        <span>
                            ${escapeHTML(
                                resource.course ||
                                "No Course"
                            )}
                        </span>

                    </div>

                    <a
                        href="${escapeAttribute(filePath)}"
                        target="_blank"
                        class="open-resource"
                    >
                        Open Resource
                    </a>

                `;


                container.appendChild(card);

            }
        );


    }
    catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty-state">

                <h2>
                    My Uploads
                </h2>

                <p>
                    My uploads are currently unavailable.
                </p>

            </div>
        `;

    }

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : value;

    return div.innerHTML;

}


function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


document.addEventListener(
    "DOMContentLoaded",
    loadMyUploads
);

</script>
