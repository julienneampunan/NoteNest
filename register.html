<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NoteNest | Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card register-card">

        <a
            href="index.html"
            class="auth-brand"
        >

            <div class="brand-logo">
                N
            </div>

            <div>
                <strong>NoteNest</strong>
                <span>Student Hub</span>
            </div>

        </a>

        <div class="auth-heading">

            <span class="badge">
                JOIN NOTENEST
            </span>

            <h1>
                Create Account
            </h1>

            <p>
                Join the student knowledge-sharing community.
            </p>

        </div>

        <form id="registerForm">

            <div class="form-grid">

                <div class="form-group full">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="e.g. BSIT"
                    >

                </div>

                <div class="form-group">

                    <label for="year_level">
                        Year Level
                    </label>

                    <select
                        id="year_level"
                        name="year_level"
                    >

                        <option value="">
                            Select year level
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                        <option value="4th Year">
                            4th Year
                        </option>

                    </select>

                </div>

            </div>

            <button
                type="submit"
                class="btn primary full-btn"
            >
                Create Account
            </button>

            <div id="registerMessage"></div>

        </form>

        <div class="auth-footer">

            <p>
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

            <a href="index.html">
                ← Back to NoteNest
            </a>

        </div>

    </div>

</div>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
        document.getElementById("registerMessage");

    message.className = "message";
    message.innerHTML = "Creating account...";

    const formData =
        new FormData(this);

    try {

        const response =
            await fetch(
                "../backend/register.php",
                {
                    method: "POST",
                    body: formData
                }
            );

        const text =
            await response.text();

        console.log(
            "REGISTER RESPONSE:",
            text
        );

        let data;

        try {

            data = JSON.parse(text);

        } catch (error) {

            message.className =
                "message error";

            message.innerHTML =
                "The server returned an invalid response.";

            return;

        }

        if (data.success) {

            message.className =
                "message success";

            message.innerHTML =
                "Account created successfully! Redirecting to login...";

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 700);

        } else {

            message.className =
                "message error";

            message.innerHTML =
                data.message ||
                "Registration failed.";

        }

    } catch (error) {

        console.error(error);

        message.className =
            "message error";

        message.innerHTML =
            "Unable to connect to NoteNest. Make sure Apache and MySQL are running.";

    }

});

</script>

</body>
</html>
